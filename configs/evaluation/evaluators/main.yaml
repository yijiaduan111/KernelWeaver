# Evaluator layer.
# This is our regular evaluator setting and only keeps torch_eager as reference.
description: Main evaluator for regular experiments.
kernelbench_evaluator: paper
reference_modes:
  - torch_eager
# Historical full-set telemetry puts the slowest healthy evaluation at 173 s.
# Keep headroom while preventing invalid kernels from occupying a GPU for the
# previous 900-second default.
paper_eval_timeout_seconds: 240
