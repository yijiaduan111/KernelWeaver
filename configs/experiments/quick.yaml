# Fast smoke run.
# Use this when you only want to check whether the chain is wired correctly.
name: quick
description: Fast smoke configuration for local validation.
workflow: stark
backend: triton
provider: mock
route: all_mock
tasks: kb_smoke
search: quick
evaluator: quick
measurement: quick
deliberation: quick
runtime: gpu_single
output_root: runs
semantics:
  enabled: true
  mode: rule
  max_anchor_hints: 6
diagnostics:
  enabled: false
  mode: disabled
  timeout_seconds: 120
  warmup_runs: 1
  profile_runs: 1
memory:
  enabled: false
  mode: expert_memory_v0
  bootstrap_cards: 3
  challenger_cards: 2
  feedback_top_k: 2
