# Main setting for our own experiments.
# Use this for the regular group baseline.
name: main
description: Main KernelWeaver configuration for regular experiments.
workflow: stark
backend: cuda
provider: openai-compatible
route: codeagent_cudallm
tasks: main_l1_15
search: main
evaluator: main
measurement: main
deliberation: main
runtime: gpu_single
output_root: runs
semantics:
  enabled: true
  mode: rule
  max_anchor_hints: 6
diagnostics:
  enabled: false
  mode: root_ncu_v1
  timeout_seconds: 900
  warmup_runs: 2
  profile_runs: 3
memory:
  enabled: false
  mode: expert_memory_v0
  bootstrap_cards: 4
  challenger_cards: 3
  feedback_top_k: 3
