# Paper-style setting.
# Use this when you want a configuration that stays closer to the original STARK paper.
name: paper
description: Paper-style STARK configuration.
workflow: stark
backend: cuda
provider: openai-compatible
route: all_gpt
tasks: kb_full_250
search: paper
evaluator: paper
measurement: paper
runtime: gpu_single
output_root: runs
semantics:
  enabled: true
  mode: rule
  max_anchor_hints: 6
