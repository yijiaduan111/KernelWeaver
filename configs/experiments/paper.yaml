# Paper-style setting.
# Use this when you want a configuration that stays closer to the original STARK paper.
name: paper
description: Paper-style STARK configuration.
workflow: stark
backend: cuda
provider: openai-compatible
route: all_gpt
tasks: kb_full_250
search: paper
evaluator: paper
measurement: paper
deliberation: paper
runtime: gpu_single
output_root: runs
semantics:
  enabled: true
  mode: rule
  max_anchor_hints: 6
diagnostics:
  enabled: false
  mode: disabled
  timeout_seconds: 300
  warmup_runs: 2
  profile_runs: 3
memory:
  enabled: false
  mode: expert_memory_v0
  bootstrap_cards: 4
  challenger_cards: 3
  feedback_top_k: 3
