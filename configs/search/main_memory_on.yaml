# Memory treatment for the 15-task paired experiment.
# Identical to main_memory_off except that cross-candidate context is enabled.
description: Main search budget with short-term cross-candidate context enabled.
max_attempts: 5
epsilon: 0.3
root_child_limit: 5
dead_branch_threshold: 3
leaderboard_size: 2
context_limit: 5
plan_temperature: 0.0
code_temperature: 0.0
debug_temperature: 0.0
timeout_seconds: 600
max_retries: 3
