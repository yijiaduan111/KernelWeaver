# No-memory control for the 15-task paired experiment.
# A zero context limit removes sibling/child/leader history from Agent prompts.
description: Main search budget with short-term cross-candidate context disabled.
max_attempts: 5
epsilon: 0.3
root_child_limit: 5
dead_branch_threshold: 3
leaderboard_size: 2
context_limit: 0
plan_temperature: 0.0
code_temperature: 0.0
debug_temperature: 0.0
timeout_seconds: 600
max_retries: 3
