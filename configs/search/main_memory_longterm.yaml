# Compatibility profile: short-term tree memory plus a writable task-experience journal.
description: Main search with short-term context plus a compact cross-task experience journal.
max_attempts: 5
epsilon: 0.3
root_child_limit: 5
dead_branch_threshold: 3
leaderboard_size: 2
context_limit: 5
long_term_memory_enabled: true
long_term_memory_top_k: 4
long_term_memory_exploration_ratio: 0.0
plan_temperature: 0.0
code_temperature: 0.0
debug_temperature: 0.0
timeout_seconds: 600
max_retries: 3
