# Search layer.
# This file keeps the search budget closer to the paper-style setting.
description: Paper-style search.
max_attempts: 30
epsilon: 0.3
root_child_limit: 5
dead_branch_threshold: 3
leaderboard_size: 2
context_limit: 5
plan_temperature: 0.8
code_temperature: 0.1
debug_temperature: 0.1
timeout_seconds: 600
max_retries: 3
