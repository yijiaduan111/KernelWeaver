# Search layer.
# Same budget as main, but disables phase-two re-rooting for flat-search ablation.
description: Main search budget without phase-two re-rooting for flat-search ablation.
max_attempts: 10
phase_two_enabled: false
phase_two_split_attempts: 5
epsilon: 0.3
root_child_limit: 5
dead_branch_threshold: 3
leaderboard_size: 2
context_limit: 5
plan_temperature: 0.8
code_temperature: 0.1
debug_temperature: 0.1
timeout_seconds: 600
max_retries: 3
