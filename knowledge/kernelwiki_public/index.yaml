version: 1
name: PyramidKernel public documentation Wiki
knowledge_scope: public_general
backend: cuda
architectures: [sm86]
policy:
  max_entries: 3
  max_body_chars: 1800
  global_constraints:
    - Preserve the actual operator contract, dtype, strides, state updates and numerical tolerance.
    - Use the permitted build environment and validate every generated candidate.
    - Read shape and layout from the current task; do not assume a shape or launch geometry from a page.
    - Optimization suggestions are hypotheses, with no measured speed guarantee.
