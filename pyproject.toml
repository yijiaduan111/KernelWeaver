[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelweaver"
version = "0.1.0"
description = "Clean STARK-style baseline for kernel optimization experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
stark = "stark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stark", "stark.*", "src", "src.*"]
