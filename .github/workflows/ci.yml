name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[benchmark,test]'
      - name: Apply the declared benchmark compatibility patch
        run: git -C KernelBench apply ../patches/kernelbench-compat.patch
      - name: Run CPU tests
        env:
          PYTHONPATH: KernelBench/src
          CUDA_VISIBLE_DEVICES: ''
        run: python -m unittest discover -s tests
      - name: Check checkout hygiene
        run: |
          python scripts/check_release.py
      - name: Build the wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify the memory-only wheel outside the checkout
        run: |
          python -m venv /tmp/kernelweaver-wheel-test
          /tmp/kernelweaver-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kernelweaver-wheel-test/bin/kernelweaver --help
          /tmp/kernelweaver-wheel-test/bin/python -c 'import importlib.util; from src.config import search_profile; assert search_profile("main_memory_longterm")["long_term_memory_enabled"]; assert importlib.util.find_spec("src.knowledge") is None'
